name: Publish package to Maven Central Repository
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: central
          # Nexus用户名环境变量
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          # Nexus密码环境变量
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          # gpg私钥
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # gpg短密码环境变量
          gpg-passphrase-env-var: GPG_PASSPHRASE
      # 显式指定使用 Maven 3.9.9，避开 3.10.0 的 bug
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.16'
      - name: Publish to Apache Maven Central
        run: mvn clean deploy --batch-mode -P release -Dmaven.test.skip=true -DskipTests -e
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}